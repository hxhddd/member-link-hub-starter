<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Member Link Hub</title>
  <style>
    :root{font-family:system-ui,-apple-system,sans-serif;color:#172033;background:#f4f6fa}
    *{box-sizing:border-box}body{margin:0;padding:24px 16px}
    main{max-width:720px;margin:8vh auto;background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:28px}
    h1{margin:0 0 10px;font-size:28px}p{line-height:1.7;color:#536176}
    .status{display:inline-block;padding:7px 12px;border-radius:99px;background:#e0f2fe;color:#075985;font-size:13px}
  </style>
</head>
<body>
  <main>
    <span class="status">Starter project</span>
    <h1>Member Link Hub</h1>
    <p>ระบบสมาชิกและกระดานภารกิจ — โครงสร้างเริ่มต้นพร้อมต่อยอด LINE Login, ระบบสมาชิก, Publisher และ Admin Review</p>
    <p id="health">กำลังตรวจสอบการเชื่อมต่อ...</p>
  </main>
  <script>
    fetch('/api/health').then(r=>r.json()).then(d=>{
      document.getElementById('health').textContent=d.ok?'เชื่อมต่อ Backend และฐานข้อมูลสำเร็จ':'Backend ยังตั้งค่าไม่ครบ';
    }).catch(()=>{document.getElementById('health').textContent='ยังไม่สามารถเชื่อมต่อ Backend ได้';});
  </script>
</body>
</html>
